<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Android: fim do descanso bloqueado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#0C0D10;color:#F2F0EC;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.m{font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:#B5B1AA}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.seg{display:flex;gap:3px}
.seg i{display:block;height:6px;border-radius:3px}
</style>
</helmet>
<div class="ph">
  <div style="padding-top: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <span style="font-size: 96px; font-weight: 500; line-height: 1; letter-spacing: -.03em">19:38</span>
    <span class="dim" style="font-size: 16px">qui., 26 de nov.</span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 6px; right: 6px; top: 322px; height: 240px; border-radius: 34px; box-shadow: 0 0 0 6px rgba(255,122,69,.18)"></div>
  <section aria-label="Descanso acabou" style="position: absolute; left: 14px; right: 14px; top: 330px; padding: 16px; border-radius: 26px; background: #FF7A45; color: #1A0D06; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; opacity: .8">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
      <span>Treino</span><span style="margin-left: auto">agora</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 48px; height: 48px; border-radius: 50%; background: rgba(26,13,6,.14); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; stroke-width: 2.2"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M20 8v8"/></svg></span>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; font-weight: 700">Hora da série 2</span>
        <span style="font-size: 14px; font-weight: 500">Rosca martelo <span class="m">16 × 10</span></span>
      </div>
    </div>
    <div class="seg" aria-hidden="true">
      <i style="flex: 3; background: #1A0D06"></i><i style="flex: 3; background: #1A0D06"></i><i style="flex: 2; background: #1A0D06"></i><i style="flex: 2; background: linear-gradient(90deg, #1A0D06 50%, rgba(26,13,6,.25) 50%)"></i><i style="flex: 2; background: rgba(26,13,6,.25)"></i><i style="flex: 2; background: rgba(26,13,6,.25)"></i><i style="flex: 2; background: rgba(26,13,6,.25)"></i>
    </div>
    <div style="display: flex; gap: 8px">
      <button class="btn" style="flex: 1; height: 44px; border-radius: 22px; background: rgba(26,13,6,.14); font-weight: 700">+30s</button>
      <button class="btn" style="flex: 1.4; height: 44px; border-radius: 22px; background: #1A0D06; color: #FF9A70; font-weight: 700">Abrir</button>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: space-between; padding: 0 44px" aria-hidden="true">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08)"></span>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08)"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
