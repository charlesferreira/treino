<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Android: tela bloqueada no descanso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#0C0D10;color:#F2F0EC;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.m{font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:#B5B1AA}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.appic{width:22px;height:22px;border-radius:50%;background:#FF7A45;color:#1A0D06;display:flex;align-items:center;justify-content:center;flex:none}
.appic .ic{width:14px;height:14px;stroke-width:2.4}
.act{flex:1;height:40px;border-radius:20px;background:rgba(255,255,255,.10);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:3px}
.seg i{display:block;height:6px;border-radius:3px}
</style>
</helmet>
<div class="ph">
  <div style="padding-top: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <span style="font-size: 96px; font-weight: 500; line-height: 1; letter-spacing: -.03em">19:37</span>
    <span class="dim" style="font-size: 16px">qui., 26 de nov.</span>
  </div>

  <section aria-label="Notificação do Treino" style="position: absolute; left: 14px; right: 14px; top: 330px; padding: 14px 16px 14px; border-radius: 26px; background: #1F2125; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px" class="dim">
      <span class="appic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></span>
      <span>Treino</span><span>Superior B</span><span style="margin-left: auto">agora</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 16px; font-weight: 700">Descanso</span>
        <span class="dim" style="font-size: 14px">Rosca martelo, série 2 de 2</span>
        <span class="m" style="font-size: 14px">16 kg × 10</span>
      </div>
      <span class="m" style="font-size: 44px; font-weight: 700; color: #FF7A45; line-height: 1">0:48</span>
    </div>
    <div class="seg" aria-label="9 de 16 séries">
      <i style="flex: 3; background: #F2F0EC"></i><i style="flex: 3; background: #F2F0EC"></i><i style="flex: 2; background: #F2F0EC"></i><i style="flex: 2; background: linear-gradient(90deg, #F2F0EC 50%, #44474F 50%)"></i><i style="flex: 2; background: #44474F"></i><i style="flex: 2; background: #44474F"></i><i style="flex: 2; background: #44474F"></i>
    </div>
    <div style="display: flex; gap: 8px; padding-top: 2px">
      <button class="btn act">−15s</button>
      <button class="btn act">+15s</button>
      <button class="btn act">Pular</button>
    </div>
  </section>

  <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 112px; height: 44px; padding: 0 16px 0 8px; border-radius: 22px; background: #1F2125; display: flex; align-items: center; gap: 10px">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#3A3D44" stroke-width="4"/><circle cx="16" cy="16" r="12" fill="none" stroke="#FF7A45" stroke-width="4" stroke-linecap="round" stroke-dasharray="75.4" stroke-dashoffset="40" transform="rotate(-90 16 16)"/></svg>
    <span class="m" style="font-size: 16px; font-weight: 700">0:48</span>
    <span class="dim" style="font-size: 13px">Descanso</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: space-between; padding: 0 44px" aria-hidden="true">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08)"></span>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08)"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
