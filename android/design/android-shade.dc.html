<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Android: notificação fixa na cortina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#0C0D10;color:#F2F0EC;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden;padding:40px 14px 0;display:flex;flex-direction:column;gap:10px}
.m{font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:#B5B1AA}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.qs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qs span{height:56px;border-radius:18px;background:#1F2125}
.notif{padding:14px 16px;border-radius:26px;background:#1F2125;display:flex;flex-direction:column;gap:10px}
.appic{width:22px;height:22px;border-radius:50%;background:#FF7A45;color:#1A0D06;display:flex;align-items:center;justify-content:center;flex:none}
.appic .ic{width:14px;height:14px;stroke-width:2.4}
.act{flex:1;height:40px;border-radius:20px;background:rgba(255,255,255,.10);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:3px}
.seg i{display:block;height:6px;border-radius:3px}
.cap{font-size:12px;font-weight:600;color:#8A867F;padding:6px 4px 0}
</style>
</helmet>
<div class="ph">
  <div style="display: flex; justify-content: space-between; padding: 0 6px 6px"><span style="font-size: 32px; font-weight: 500">19:36</span><span class="dim" style="font-size: 13px; align-self: flex-end; padding-bottom: 6px">qui., 26 de nov.</span></div>
  <div class="qs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <span class="cap">Entre séries</span>
  <section class="notif" aria-label="Treino em andamento">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px" class="dim">
      <span class="appic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></span>
      <span>Treino</span><span class="m" style="margin-left: auto">35:02</span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 700">Superior B</span>
      <span class="m" style="font-size: 15px">9<span class="dim">/16</span></span>
    </div>
    <div class="seg" aria-hidden="true">
      <i style="flex: 3; background: #FF7A45"></i><i style="flex: 3; background: #FF7A45"></i><i style="flex: 2; background: #FF7A45"></i><i style="flex: 2; background: linear-gradient(90deg, #FF7A45 50%, #44474F 50%)"></i><i style="flex: 2; background: #44474F"></i><i style="flex: 2; background: #44474F"></i><i style="flex: 2; background: #44474F"></i>
    </div>
    <div style="display: flex; flex-direction: column">
      <span class="dim" style="font-size: 13px">A seguir</span>
      <span style="font-size: 14px">Rosca martelo, série 2 de 2 <span class="m">16 × 10</span></span>
    </div>
    <div style="display: flex; gap: 8px">
      <button class="btn act" style="background: #FF7A45; color: #1A0D06">Registrar série</button>
      <button class="btn act" style="flex: .6">Abrir</button>
    </div>
  </section>

  <span class="cap">Descansando, recolhida</span>
  <section class="notif" aria-label="Descanso" style="flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px">
    <span class="appic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></span>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
      <span style="font-size: 14px; font-weight: 700">Descanso</span>
      <span class="dim" style="font-size: 13px">Próxima: <span class="m">16 × 10</span></span>
    </div>
    <span class="m" style="font-size: 26px; font-weight: 700; color: #FF7A45">0:48</span>
  </section>

  <section class="notif" aria-hidden="true" style="opacity: .5; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px">
    <span style="width: 22px; height: 22px; border-radius: 50%; background: #44474F"></span>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="width: 40%; height: 10px; border-radius: 5px; background: #44474F"></span><span style="width: 70%; height: 10px; border-radius: 5px; background: #33363D"></span></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
