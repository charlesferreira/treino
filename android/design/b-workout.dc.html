<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Treino em andamento, direção B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#101113;color:#F2F0EC;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.m{font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:#A8A49D}
.faint{color:#8A867F}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.card{background:#1A1C20;border-radius:22px;border:1px solid rgba(255,255,255,.06)}
.lbl{font-size:12px;font-weight:500;color:#A8A49D}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;background:#24272C;color:#D6D2CB;font-size:12px;font-weight:500;white-space:nowrap}
.tag .ic{width:14px;height:14px}
.tag.acc{background:rgba(255,122,69,.14);color:#FF9A70}
.tabbar{position:absolute;left:20px;right:20px;bottom:24px;height:62px;box-sizing:border-box;border-radius:31px;background:#1F2125;border:1px solid rgba(255,255,255,.08);display:flex;padding:0 8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#8A867F}
.tab.on{color:#FF7A45}
.pbtn{height:54px;border-radius:27px;background:#FF7A45;color:#1A0D06;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.tbl{display:grid;grid-template-columns:36px minmax(0,1fr) 72px 60px 36px;align-items:center;column-gap:8px}
.cell{height:40px;border-radius:10px;background:#24272C;display:flex;align-items:center;justify-content:center;font-size:17px}
.dot{width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:2px solid #3A3D44}
.done{width:22px;height:22px;border-radius:50%;background:#FF7A45;color:#1A0D06;display:flex;align-items:center;justify-content:center;flex:none}
.done .ic{width:13px;height:13px;stroke-width:3}
.stp{flex:1;display:flex;align-items:center;height:52px;border-radius:26px;background:#24272C}
.stp .btn{width:52px;height:52px;font-weight:700;font-size:14px;color:#D6D2CB}
.stp .v{flex:1;text-align:center}
.rir .btn{width:40px;height:36px;border-radius:10px;background:#24272C;font-weight:600;color:#D6D2CB}
</style>
</helmet>
<div class="ph" style="padding: 54px 14px 0; display: flex; flex-direction: column; gap: 12px">
  <header style="padding: 0 6px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column">
        <span class="lbl">Quinta, 26 nov</span>
        <button class="btn" style="display: flex; align-items: center; gap: 4px" aria-label="Trocar treino"><span style="font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15">Superior B</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #8A867F"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div style="height: 40px; padding: 0 12px; border-radius: 20px; background: #1A1C20; display: flex; align-items: center; gap: 6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: #A8A49D"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span class="m" style="font-size: 15px">34:12</span></div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #24272C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">CF</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; display: flex; gap: 4px" aria-hidden="true">
        <i style="flex: 3; height: 8px; border-radius: 4px; background: #FF7A45"></i><i style="flex: 3; height: 8px; border-radius: 4px; background: #FF7A45"></i><i style="flex: 2; height: 8px; border-radius: 4px; background: #FF7A45"></i><i style="flex: 2; height: 8px; border-radius: 4px; background: #3A3D44"></i><i style="flex: 2; height: 8px; border-radius: 4px; background: #2A2D33"></i><i style="flex: 2; height: 8px; border-radius: 4px; background: #2A2D33"></i><i style="flex: 2; height: 8px; border-radius: 4px; background: #2A2D33"></i>
      </div>
      <span class="m" style="font-size: 15px">8<span class="faint">/16</span></span>
    </div>
  </header>

  <div class="card" style="padding: 6px 16px">
    <div style="display: flex; align-items: center; gap: 10px; height: 40px"><span class="done"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span style="flex: 1; font-size: 14px; font-weight: 500">Desenvolvimento c/ halteres</span><span class="m dim" style="font-size: 13px">18 kg</span></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; border-top: 1px solid rgba(255,255,255,.06)"><span class="done"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span style="flex: 1; font-size: 14px; font-weight: 500">Puxada supinada</span><span class="m dim" style="font-size: 13px">64 kg</span></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; border-top: 1px solid rgba(255,255,255,.06)"><span class="done"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span style="flex: 1; font-size: 14px; font-weight: 500">Peck deck</span><span class="m dim" style="font-size: 13px">45 kg</span></div>
  </div>

  <section class="card" style="padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; border-color: rgba(255,122,69,.35)">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 21px; font-weight: 700; letter-spacing: -.01em">Rosca martelo</span>
        <span class="m faint" style="font-size: 13px">2 × 10–12</span>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span class="tag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Halteres 2×</span>
        <span class="tag">1:30</span>
        <span class="tag">máx 14 kg</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="tbl lbl" style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase"><span>Série</span><span>19 nov</span><span style="text-align: center">kg/halter</span><span style="text-align: center">Reps</span><span></span></div>
      <div class="tbl" style="padding: 6px 0; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 14px; background: rgba(255,122,69,.07)">
        <span class="m" style="font-size: 16px; color: #FF7A45; text-align: center">1</span>
        <span class="m faint" style="font-size: 14px">14 × 12</span>
        <span class="cell m" style="box-shadow: inset 0 0 0 2px #FF7A45">14</span>
        <span class="cell m">12</span>
        <span class="dot" style="border-color: #FF7A45"></span>
      </div>
      <div class="tbl" style="opacity: .55">
        <span class="m" style="font-size: 16px; text-align: center">2</span>
        <span class="m faint" style="font-size: 14px">14 × 12</span>
        <span class="cell m">14</span>
        <span class="cell m">12</span>
        <span class="dot"></span>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <div class="stp"><button class="btn" aria-label="Menos 2 kg">−2</button><span class="v m" style="font-size: 15px">14 kg</span><button class="btn" aria-label="Mais 2 kg">+2</button></div>
      <div class="stp"><button class="btn" aria-label="Menos 1 rep">−1</button><span class="v m" style="font-size: 15px">12</span><button class="btn" aria-label="Mais 1 rep">+1</button></div>
    </div>
    <button class="btn pbtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Registrar série 1</button>
  </section>

  <nav class="tabbar" aria-label="Menu"><button class="btn tab on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Hoje</button><button class="btn tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-4M11 16V8M16 16v-6M21 16V4"/></svg>Evolução</button><button class="btn tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Treinos</button></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
