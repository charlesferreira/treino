<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Revisão das cargas antigas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#0B0C0F;color:#F4F6FA;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.dim{color:#9AA3B2}
.faint{color:#7C8594}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9AA3B2}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.srow{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.flag{padding:12px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,180,84,.05);display:flex;flex-direction:column;gap:10px}
.ch{flex:1;height:44px;border-radius:12px;background:#15171C;border:1px solid rgba(255,255,255,.10);font-size:14px;font-weight:600;color:#C9D0DB}
.ch.on{background:rgba(204,250,78,.12);border-color:#CCFA4E;color:#CCFA4E}
.primary{height:56px;border-radius:16px;background:#CCFA4E;color:#0F1704;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;width:100%}
</style>
</helmet>
<div class="ph">
  <header style="padding: 52px 12px 6px; display: flex; align-items: center; gap: 4px">
    <button class="btn" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="font-weight: 700; font-size: 17px; flex: 1">Revisar cargas de halteres</span>
    <span class="dim" style="font-size: 13px; margin-right: 8px">1 de 2</span>
  </header>

  <div style="padding: 6px 20px 0; display: flex; flex-direction: column; gap: 2px">
    <h2 class="n" style="margin: 0; font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1">Supino inclinado c/ halteres</h2>
    <span class="dim" style="font-size: 13px">2 sessões com carga perto do dobro das vizinhas</span>
  </div>

  <figure style="margin: 0; padding: 12px 20px 4px">
    <svg viewBox="0 0 350 130" width="350" height="130" role="img" aria-label="Cargas anotadas: 14, 16, 16, 36, 36 e 18 kg. Com a correção: 14, 16, 16, 18, 18 e 18 kg">
      <g stroke="rgba(255,255,255,.07)"><line x1="0" y1="20" x2="350" y2="20"/><line x1="0" y1="70" x2="350" y2="70"/><line x1="0" y1="110" x2="350" y2="110"/></g>
      <g fill="#7C8594" font-family="Inter, sans-serif" font-size="11"><text x="0" y="16">36</text><text x="0" y="66">18</text></g>
      <path d="M30 101 L92 94 L154 94 L216 22 L278 22 L340 87" fill="none" stroke="#FFB454" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M30 101 L92 94 L154 94 L216 87 L278 87 L340 87" fill="none" stroke="#CCFA4E" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#FFB454"><circle cx="216" cy="22" r="5"/><circle cx="278" cy="22" r="5"/></g>
      <g fill="#0B0C0F" stroke="#CCFA4E" stroke-width="2.5"><circle cx="30" cy="101" r="4"/><circle cx="92" cy="94" r="4"/><circle cx="154" cy="94" r="4"/><circle cx="216" cy="87" r="4"/><circle cx="278" cy="87" r="4"/><circle cx="340" cy="87" r="4"/></g>
    </svg>
    <figcaption style="display: flex; gap: 16px; font-size: 12px; padding-top: 4px" class="dim">
      <span style="display: flex; align-items: center; gap: 6px"><i style="width: 14px; height: 3px; background: #FFB454; display: block"></i>Anotado</span>
      <span style="display: flex; align-items: center; gap: 6px"><i style="width: 14px; height: 3px; background: #CCFA4E; display: block"></i>Com as correções</span>
    </figcaption>
  </figure>

  <div style="border-top: 1px solid rgba(255,255,255,.08); margin-top: 10px">
    <div class="srow"><span class="faint" style="width: 52px; font-size: 13px">10 set</span><span style="flex: 1; font-size: 14px" class="dim">16 × 10, 16 × 9, 16 × 8</span><span class="n" style="font-size: 20px">16 kg</span></div>
    <div class="flag">
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="faint" style="width: 52px; font-size: 13px">24 set</span>
        <span style="flex: 1; font-size: 14px" class="dim">36 × 10, 36 × 9, 36 × 8</span>
        <span class="n" style="font-size: 20px; color: #FFB454">36 kg</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button class="btn ch">Por halter, 36</button>
        <button class="btn ch on">Era o par, vira 18</button>
      </div>
    </div>
    <div class="flag">
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="faint" style="width: 52px; font-size: 13px">01 out</span>
        <span style="flex: 1; font-size: 14px" class="dim">36 × 11, 36 × 10, 36 × 9</span>
        <span class="n" style="font-size: 20px; color: #FFB454">36 kg</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button class="btn ch">Por halter, 36</button>
        <button class="btn ch">Era o par, vira 18</button>
      </div>
    </div>
    <div class="srow"><span class="faint" style="width: 52px; font-size: 13px">08 out</span><span style="flex: 1; font-size: 14px" class="dim">18 × 10, 18 × 9, 18 × 9</span><span class="n" style="font-size: 20px">18 kg</span></div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 8px">
    <button class="btn primary">Aplicar 1 correção</button>
    <button class="btn" style="height: 44px; font-weight: 600; color: #C9D0DB">Manter tudo como está</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
