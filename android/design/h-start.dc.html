<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hoje antes de começar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#101113;color:#F2F0EC;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.m{font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:#A8A49D}
.faint{color:#8A867F}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.card{background:#1A1C20;border-radius:22px;border:1px solid rgba(255,255,255,.06)}
.lbl{font-size:12px;font-weight:500;color:#A8A49D}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;background:#24272C;color:#D6D2CB;font-size:12px;font-weight:500;white-space:nowrap}
.tag .ic{width:14px;height:14px}
.tag.acc{background:rgba(255,122,69,.14);color:#FF9A70}
.tabbar{position:absolute;left:20px;right:20px;bottom:24px;height:62px;box-sizing:border-box;border-radius:31px;background:#1F2125;border:1px solid rgba(255,255,255,.08);display:flex;padding:0 8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#8A867F}
.tab.on{color:#FF7A45}
.pbtn{height:54px;border-radius:27px;background:#FF7A45;color:#1A0D06;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.tbl{display:grid;grid-template-columns:36px minmax(0,1fr) 72px 60px 36px;align-items:center;column-gap:8px}
.cell{height:40px;border-radius:10px;background:#24272C;display:flex;align-items:center;justify-content:center;font-size:17px}
.dot{width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:2px solid #3A3D44}
.done{width:22px;height:22px;border-radius:50%;background:#FF7A45;color:#1A0D06;display:flex;align-items:center;justify-content:center;flex:none}
.done .ic{width:13px;height:13px;stroke-width:3}
.stp{flex:1;display:flex;align-items:center;height:52px;border-radius:26px;background:#24272C}
.stp .btn{width:52px;height:52px;font-weight:700;font-size:14px;color:#D6D2CB}
.stp .v{flex:1;text-align:center}
.rir .btn{width:40px;height:36px;border-radius:10px;background:#24272C;font-weight:600;color:#D6D2CB}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.chev{width:18px;height:18px;color:#8A867F}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8A867F;padding:0 6px}
.tg{width:46px;height:28px;border-radius:14px;background:#3A3D44;position:relative;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#D6D2CB}
.tg.on{background:#FF7A45}.tg.on::after{left:21px;background:#1A0D06}
.gbtn{height:50px;border-radius:25px;background:#24272C;color:#F2F0EC;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#1A1C20;border-radius:28px 28px 0 0;padding:10px 18px 34px;display:flex;flex-direction:column;gap:14px;border-top:1px solid rgba(255,255,255,.08)}
.grab{width:40px;height:5px;border-radius:3px;background:#3A3D44;align-self:center}
.chip{height:36px;padding:0 14px;border-radius:18px;background:#24272C;color:#D6D2CB;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#FF7A45;color:#1A0D06}
.inp{height:48px;border-radius:14px;background:#24272C;display:flex;align-items:center;padding:0 14px;gap:10px;font-size:15px}
</style>
</helmet>
<div class="ph" style="padding:54px 14px 0;display:flex;flex-direction:column;gap:14px">
  <header style="padding:0 6px;display:flex;align-items:center;gap:10px">
    <div style="flex:1;display:flex;flex-direction:column"><span class="lbl">Quinta, 26 nov</span>
    <button class="btn" style="display:flex;align-items:center;gap:4px" aria-label="Trocar treino"><span style="font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15">Superior B</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:#8A867F"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <div style="width:40px;height:40px;border-radius:50%;background:#24272C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">CF</div>
  </header>
  <div style="display:flex;gap:8px;padding:0 6px"><span class="tag">7 exercícios</span><span class="tag m">17 séries</span><span class="tag">último em 19 nov</span></div>
  <div class="card" style="padding:4px 0"><div class="row"><span class="m faint" style="width:18px;font-size:13px">1</span><span style="flex:1;font-size:14px;font-weight:500">Desenvolvimento c/ halteres</span><span class="m faint" style="font-size:12px">3 × 8–12</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">18 kg</span></div><div class="row"><span class="m faint" style="width:18px;font-size:13px">2</span><span style="flex:1;font-size:14px;font-weight:500">Puxada supinada</span><span class="m faint" style="font-size:12px">3 × 8–12</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">64 kg</span></div><div class="row"><span class="m faint" style="width:18px;font-size:13px">3</span><span style="flex:1;font-size:14px;font-weight:500">Remada baixa</span><span class="m faint" style="font-size:12px">3 × 10–12</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">52 kg</span></div><div class="row"><span class="m faint" style="width:18px;font-size:13px">4</span><span style="flex:1;font-size:14px;font-weight:500">Peck deck</span><span class="m faint" style="font-size:12px">2 × 12–15</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">45 kg</span></div><div class="row"><span class="m faint" style="width:18px;font-size:13px">5</span><span style="flex:1;font-size:14px;font-weight:500">Rosca martelo</span><span class="m faint" style="font-size:12px">2 × 10–12</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">14 kg</span></div><div class="row"><span class="m faint" style="width:18px;font-size:13px">6</span><span style="flex:1;font-size:14px;font-weight:500">Tríceps na polia</span><span class="m faint" style="font-size:12px">2 × 10–15</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">27 kg</span></div><div class="row"><span class="m faint" style="width:18px;font-size:13px">7</span><span style="flex:1;font-size:14px;font-weight:500">Elevação lateral</span><span class="m faint" style="font-size:12px">2 × 12–15</span><span class="m dim" style="font-size:13px;width:44px;text-align:right">8 kg</span></div></div>
  <button class="btn gbtn" style="height:44px;font-size:14px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Nota do dia</button>
  <div style="position:absolute;left:14px;right:14px;bottom:104px"><button class="btn pbtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.6"><path d="M8 5l11 7-11 7z"/></svg>Começar treino</button></div>
  <nav class="tabbar" aria-label="Menu"><button class="btn tab on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Hoje</button><button class="btn tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-4M11 16V8M16 16v-6M21 16V4"/></svg>Evolução</button><button class="btn tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Treinos</button></nav>
</div>
</x-dc>

</html>
